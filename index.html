
<script>

/* اتصال به سرور اختصاصی Cloudflare */
const API_URL="https://royal-news-api-2026.hazhiralizadeh3039.workers.dev/";
const SEASON="2026";
const REAL_MADRID_ID=86;

let scorerStats={};
let scorerStatsLoaded=false;

async function apiRequest(endpoint){
  const url=new URL(API_URL);
  url.searchParams.set("endpoint",endpoint);
  url.searchParams.set("season",SEASON);

  const response=await fetch(url.toString());
  const data=await response.json();

  if(!response.ok){
    throw new Error(data.message||data.error||"خطا در دریافت اطلاعات");
  }
  if(data.error){
    throw new Error(data.message||data.error);
  }
  return data;
}

/* دریافت آمار گلزنان لالیگا */
async function loadScorers(){
  if(scorerStatsLoaded) return;

  const data=await apiRequest("scorers");
  scorerStats={};

  (data.scorers||[]).forEach(item=>{
    const player=item.player;
    if(!player||!player.name) return;

    const key=normalizeName(player.name);

    scorerStats[key]={
      matches:item.playedMatches??null,
      goals:item.goals??null,
      assists:item.assists??null,
      penalties:item.penalties??null,
      team:item.team?.name||"نامشخص"
    };
  });

  scorerStatsLoaded=true;
}

function normalizeName(name){
  return String(name)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}

function formatDate(date){
  if(!date)return "تاریخ نامشخص";
  return new Date(date).toLocaleString("fa-IR",{
    year:"numeric",
    month:"long",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function showError(element,message){
  element.innerHTML=`
  <div class="api-error">
    خطا در دریافت اطلاعات از سرور.<br>
    ${message}<br>
    لطفاً چند لحظه بعد دوباره امتحان کنید.
  </div>`;
}

/* جدول لالیگا */
async function loadTable(){
  const area=document.getElementById("tableContent");
  area.innerHTML="در حال دریافت جدول لالیگا...";

  try{
    const data=await apiRequest("standings");
    const standings=data.standings||[];
    const total=standings.find(s=>s.type==="TOTAL")||standings[0];

    if(!total||!total.table||!total.table.length){
      throw new Error("جدول در پاسخ سرور پیدا نشد.");
    }

    let html=`
    <div class="notice">
      لیگ: ${data.competition?.name||"Primera Division"}
      <br>
      فصل: ${data.season?.startDate||"2026"} تا ${data.season?.endDate||"2027"}
      <br>
      هفته: ${data.season?.currentMatchday||"نامشخص"}
    </div>
    <div class="table-wrap">
    <table class="league-table">
    <thead>
    <tr>
      <th>رتبه</th><th>تیم</th><th>بازی</th>
      <th>برد</th><th>مساوی</th><th>باخت</th>
      <th>تفاضل</th><th>امتیاز</th>
    </tr>
    </thead><tbody>`;

    total.table.forEach(team=>{
      const isMadrid=team.team.id===REAL_MADRID_ID;
      html+=`
      <tr class="${isMadrid?"real-madrid":""}">
        <td>${team.position}</td>
        <td>
          <div class="team-name">
            <img src="${team.team.crest}" alt="">
            ${team.team.shortName||team.team.name}
          </div>
        </td>
        <td>${team.playedGames}</td>
        <td>${team.won}</td>
        <td>${team.draw}</td>
        <td>${team.lost}</td>
        <td>${team.goalDifference}</td>
        <td><strong>${team.points}</strong></td>
      </tr>`;
    });

    html+="</tbody></table></div>";
    area.innerHTML=html;

  }catch(error){
    showError(area,error.message);
  }
}

/* ساخت کارت مسابقه */
function createMatchCard(match){
  const home=match.homeTeam||{};
  const away=match.awayTeam||{};
  const finished=match.status==="FINISHED";

  let score="VS";
  if(finished){
    const goals=match.score?.fullTime;
    if(goals&&goals.home!==null&&goals.away!==null){
      score=`${goals.home} - ${goals.away}`;
    }
  }

  return `
  <div class="match-card">
    <div class="match-teams">
      <div class="match-team">
        <img src="${home.crest||""}" alt="">
        <strong>${home.shortName||home.name||"تیم میزبان"}</strong>
      </div>
      <div class="match-score">${score}</div>
      <div class="match-team">
        <img src="${away.crest||""}" alt="">
        <strong>${away.shortName||away.name||"تیم مهمان"}</strong>
      </div>
    </div>
    <div class="match-meta">
      ${match.competition?.name||"مسابقات فوتبال"}
      <br>${formatDate(match.utcDate)}
    </div>
    <div class="match-status">
      ${finished?"پایان مسابقه":match.status==="IN_PLAY"?"در حال برگزاری":"برنامه‌ریزی شده"}
    </div>
  </div>`;
}

/* مسابقات پیش رو */
async function loadMatches(){
  const area=document.getElementById("matchesContent");
  area.innerHTML="در حال دریافت مسابقات...";

  try{
    const data=await apiRequest("matches");
    const matches=(data.matches||[])
      .filter(m=>
        ["SCHEDULED","TIMED","IN_PLAY"].includes(m.status)&&
        (m.homeTeam?.id===REAL_MADRID_ID||m.awayTeam?.id===REAL_MADRID_ID)
      )
      .sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate))
      .slice(0,10);

    if(!matches.length){
      area.innerHTML="در حال حاضر مسابقه آینده‌ای در اطلاعات دریافتی پیدا نشد.";
      return;
    }
    area.innerHTML=matches.map(createMatchCard).join("");

  }catch(error){
    showError(area,error.message);
  }
}

/* آخرین نتایج */
async function loadResults(){
  const area=document.getElementById("resultsContent");
  area.innerHTML="در حال دریافت نتایج...";

  try{
    const data=await apiRequest("matches");
    const matches=(data.matches||[])
      .filter(m=>
        m.status==="FINISHED"&&
        (m.homeTeam?.id===REAL_MADRID_ID||m.awayTeam?.id===REAL_MADRID_ID)
      )
      .sort((a,b)=>new Date(b.utcDate)-new Date(a.utcDate))
      .slice(0,10);

    if(!matches.length){
      area.innerHTML="نتیجه نهایی مسابقه‌ای در اطلاعات دریافتی پیدا نشد.";
      return;
    }
    area.innerHTML=matches.map(createMatchCard).join("");

  }catch(error){
    showError(area,error.message);
  }
}

function showPage(id,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  if(btn)btn.classList.add("active");

  window.scrollTo({top:0,behavior:"smooth"});

  if(id==="players")renderPlayers();
  if(id==="table")loadTable();
  if(id==="matches")loadMatches();
  if(id==="results")loadResults();
}

/* تصاویر بازیکنان */
function imageURL(code){
  const officialPhotos={
    BERNARDO:"https://assets.realmadrid.com/is/image/realmadrid/BERRNARDO-SILVA_POSE_1500X2000?$Desktop$=&fit=wrap&wid=600",
    DIOMANDE:"https://assets.realmadrid.com/is/image/realmadrid/YAN-DIOMANDE_POSE_1500X2000?$Desktop$=&fit=wrap&wid=600",
    CARLOS_ESPI:"https://assets.realmadrid.com/is/image/realmadrid/ESPI_POSE_1500X2000?$Desktop$=&fit=wrap&wid=600",
    VINI_JR:"https://assets.realmadrid.com/is/image/realmadrid/VINI_POSE_1500X2000?$Desktop$=&fit=wrap&wid=600",
    ARDA_GULER:"https://assets.realmadrid.com/is/image/realmadrid/ARDA_POSE_1500X2000?$Desktop$=&fit=wrap&wid=600"
  };

  if(officialPhotos[code])return officialPhotos[code];

  return "https://assets.realmadrid.com/is/image/realmadrid/"+code+"_POSE_1500X2000?$Desktop$=&fit=wrap&wid=600";
}

function renderPlayers(list=players){
  const area=document.getElementById("playersList");
  area.innerHTML="";

  list.forEach(p=>{
    const card=document.createElement("div");
    card.className="player-card";

    card.innerHTML=`
      <img src="${imageURL(p[3])}" alt="${p[0]}" loading="lazy">
      <h3>${p[0]}</h3>
      <div class="number">${p[1]}</div>
      <p>${p[2]}</p>`;

    const img=card.querySelector("img");
    img.onerror=function(){
      this.onerror=null;
      this.src="https://placehold.co/600x800/183451/e5c66a?text=REAL+MADRID";
    };

    card.onclick=()=>openPlayer(p);
    area.appendChild(card);
  });
}

function searchPlayers(){
  const q=document.getElementById("playerSearch").value.toLowerCase().trim();

  renderPlayers(players.filter(p=>
    p[0].toLowerCase().includes(q)||
    p[2].includes(q)||
    String(p[1]).includes(q)
  ));
}

/* کارت آمار */
function statCard(icon,label){
  return `
  <div class="stat-card">
    <div class="stat-icon">${icon}</div>
    <div class="stat-value">—</div>
    <div class="stat-label">${label}</div>
    <div class="stat-status">اطلاعات در دسترس نیست</div>
  </div>`;
}

function seasonStatCard(icon,label,value,available){
  return `
  <div class="stat-card">
    <div class="stat-icon">${icon}</div>
    <div class="stat-value">${value===null||value===undefined?"—":value}</div>
    <div class="stat-label">${label}</div>
    <div class="stat-status">
      ${available?"آمار ثبت‌شده در لالیگا":"آمار تأییدشده در این فهرست موجود نیست"}
    </div>
  </div>`;
}
